name: Local by Local Browser and HIG Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run responsive and touch-target browser audit
        run: python tests/browser_hig_audit.py
      - name: Upload screenshots and diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-hig-audit
          path: artifacts/browser-audit/
          if-no-files-found: warn
