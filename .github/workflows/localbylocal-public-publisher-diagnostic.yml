name: Local by Local - Public Publisher Diagnostic
on:
  workflow_dispatch:
    inputs:
      articles_per_feed:
        description: "Sample articles per feed"
        type: choice
        options: ["1", "3", "5"]
        default: "3"
  push:
    paths:
      - ".github/workflows/localbylocal-public-publisher-diagnostic.yml"
      - "research_diagnostics/public_publisher_diagnostic.py"
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python
        run: python -m py_compile research_diagnostics/public_publisher_diagnostic.py
      - name: Test public publisher feeds and sample articles
        env:
          ARTICLES_PER_FEED: ${{ inputs.articles_per_feed || '3' }}
        run: python -u research_diagnostics/public_publisher_diagnostic.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-publisher-diagnostic
          path: diagnostic_results/
          if-no-files-found: warn
